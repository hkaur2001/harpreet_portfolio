name: ci

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  agent-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/agent-runtime/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  sentinel-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sentinel/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
