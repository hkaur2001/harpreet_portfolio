name: ci

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run evals:offline
      - run: npm run build
      - name: Run production HTTP stress suite
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 >/tmp/portfolio-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/sentinel/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/sentinel/health >/dev/null || (cat /tmp/portfolio-next.log && exit 1)
          npm run stress:http

  agent-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/agent-runtime/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  sentinel-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sentinel/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile and import runtime surfaces
        run: |
          python -m compileall -q app
          python -c "import app.main; import app.mcp_server"
      - run: python -m pytest -q
      - name: Validate local platform configuration
        run: docker compose -f ../docker-compose.yml config >/dev/null
